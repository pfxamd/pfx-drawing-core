[package]
name = "pfx_vello_complex"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
vello_cpu = { path = "../vello/vello_cpu", features = ["f32_pipeline"] }
vello_common = { path = "../vello/vello_common" }
