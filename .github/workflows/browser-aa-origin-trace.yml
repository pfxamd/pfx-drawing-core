name: Vello CPU antialias origin and coverage isolation
on:
  push:
    branches:
      - experiment/browser-aa-origin-trace
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# JS-only regression revision: reuse the source-built and verified Vello WASM
# artifact from run 38246676286. When editing Rust/Cargo, reinstate a source build.
jobs:
  verify-aa-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-aa-origin-vello-build
          run-id: 38246676286
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Assemble independent browser proof
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-origin-trace.cjs
      - name: Verify single-path coverage and origin-dependent raster differences
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
            node compatibility/browser/test-aa-origin-trace.cjs
          test -s artifacts/browser/proof/aa-origin-summary.json
      - name: Retain machine-readable and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-aa-origin-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
