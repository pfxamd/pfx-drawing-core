name: Vello CPU affine stroke and clipping global flatten validation
on:
  push:
    branches:
      - experiment/browser-aa-transform-stroke-clip
    paths:
      - '.github/workflows/browser-aa-transform-stroke-clip.yml'
      - 'compatibility/browser/aa-coverage-internals/**'
      - 'compatibility/browser/vello-complex/**'
      - 'compatibility/browser/web/aa-precision.html'
      - 'compatibility/browser/test-aa-transform-stroke-clip.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# Browser test-only revision: replay the WASM freshly compiled from source
# in GitHub Actions run 38255408097, guarded by exact source blob hashes.
jobs:
  browser-extended-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-vello-extended-build
          run-id: 38255408097
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Refuse stale WASM when Rust or source patch changes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object compatibility/browser/vello-complex/src/lib.rs)" = f766986e80a2d8756a4af725fb144b3fae37cb45
          test "$(git hash-object compatibility/browser/vello-complex/Cargo.toml)" = 5c219a8bbcfcb8b129c24cbdcb6b7eb48f25315e
          test "$(git hash-object compatibility/browser/aa-coverage-internals/pfx_trace.rs)" = 6242e86868b211b68fb5b3712fc6bdc4973eee0c
          test "$(git hash-object compatibility/browser/aa-coverage-internals/patch-upstream.cjs)" = 399cfad80c72f1c945df8e9c8472a0d350c89818
          test "$(git hash-object compatibility/browser/web/aa-precision.html)" = d2ca7d92a6f4cb50577f3f141ec49184b518aaf1
      - name: Assemble fully local source-built browser harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-transform-stroke-clip.cjs
      - name: Compare byte-exact RGBA for affine filled, stroked and clipped scenes
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
          node compatibility/browser/test-aa-transform-stroke-clip.cjs
          test -s artifacts/browser/proof/aa-extended-summary.json
      - name: Keep complete positive or negative browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-vello-extended-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
