name: Source Compatibility Lab — native + browser build probes
on:
  push:
    branches:
      - 'experiment/source-compatibility-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vello-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned Vello source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          git clone --filter=blob:none --no-checkout https://github.com/linebender/vello.git "$RUNNER_TEMP/vello"
          cd "$RUNNER_TEMP/vello"
          git fetch --depth=1 origin 235739c4f08eb48d900e1512459d453a9ab77f96
          git checkout --detach 235739c4f08eb48d900e1512459d453a9ab77f96
          test "$(git rev-parse HEAD)" = "235739c4f08eb48d900e1512459d453a9ab77f96"
          cp "$GITHUB_WORKSPACE/compatibility/probes/vello-cpu.rs" vello_cpu/examples/pfx_compat.rs
          cargo --version
      - name: Build Vello CPU FROM SOURCE and verify actual raster pixels
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/vello"
          export PFX_OUTPUT="$GITHUB_WORKSPACE/artifacts/vello-cpu.ppm"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/vello-build-time.txt" \
            cargo run -p vello_cpu --example pfx_compat --release --locked \
              2>&1 | tee "$GITHUB_WORKSPACE/artifacts/vello-native.log"
          test -s "$PFX_OUTPUT"
      - name: Retain native Vello evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-compat-vello-native
          path: artifacts/
          if-no-files-found: ignore

  vello-browser-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Vello and install WASM target
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          git clone --filter=blob:none --no-checkout https://github.com/linebender/vello.git "$RUNNER_TEMP/vello"
          cd "$RUNNER_TEMP/vello"
          git fetch --depth=1 origin 235739c4f08eb48d900e1512459d453a9ab77f96
          git checkout --detach 235739c4f08eb48d900e1512459d453a9ab77f96
          rustup target add wasm32-unknown-unknown
      - name: Compile source Vello CPU browser entry (WASM)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/vello"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/vello-wasm-cpu-time.txt" \
            cargo check --target wasm32-unknown-unknown -p wasm_cpu --locked \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/vello-wasm-cpu.log"
      - name: Compile source Vello GPU WebGL2 browser entry (WASM)
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/vello"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/vello-wasm-webgl2-time.txt" \
            cargo check --target wasm32-unknown-unknown -p native_webgl --locked \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/vello-wasm-webgl2.log"
      - name: Retain browser-compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-compat-vello-wasm
          path: artifacts/
          if-no-files-found: ignore

  filament-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Filament host build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libc++-dev libc++abi-dev libglu1-mesa-dev \
            libxi-dev libxcomposite-dev libxxf86vm-dev ninja-build cmake
          mkdir -p artifacts
      - name: Fetch pinned Filament source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/google/filament.git "$RUNNER_TEMP/filament"
          cd "$RUNNER_TEMP/filament"
          git fetch --depth=1 origin 764fe6cac9bdb4ba24d3d852344dfa04a5f70f75
          git checkout --detach 764fe6cac9bdb4ba24d3d852344dfa04a5f70f75
          test "$(git rev-parse HEAD)" = "764fe6cac9bdb4ba24d3d852344dfa04a5f70f75"
          clang++ --version | head -1
      - name: Configure and compile Filament native core library FROM SOURCE
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/filament-configure-time.txt" \
            cmake -S "$RUNNER_TEMP/filament" -B "$RUNNER_TEMP/filament-build" -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_BUILD_TYPE=Release -DFILAMENT_SKIP_SAMPLES=ON \
              -DFILAMENT_SUPPORTS_VULKAN=OFF -DFILAMENT_SUPPORTS_OPENGL=ON \
              2>&1 | tee "$GITHUB_WORKSPACE/artifacts/filament-configure.log"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/filament-build-time.txt" \
            cmake --build "$RUNNER_TEMP/filament-build" --target filament --parallel 2 \
              2>&1 | tee "$GITHUB_WORKSPACE/artifacts/filament-build.log"
          find "$RUNNER_TEMP/filament-build" -name '*filament*.a' | tee "$GITHUB_WORKSPACE/artifacts/filament-library-paths.txt"
          test -s "$GITHUB_WORKSPACE/artifacts/filament-library-paths.txt"
      - name: Retain Filament compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-compat-filament-native
          path: artifacts/
          if-no-files-found: ignore

  skia-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Skia host prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build cmake libfontconfig1-dev libfreetype-dev \
            libpng-dev libjpeg-dev libwebp-dev libexpat1-dev zlib1g-dev libgl1-mesa-dev libxi-dev
          mkdir -p artifacts
      - name: Fetch pinned Skia source and its GN dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/google/skia.git "$RUNNER_TEMP/skia"
          cd "$RUNNER_TEMP/skia"
          git fetch --depth=1 origin b23ddbff12658185f0d506befec22a84f8b8c03b
          git checkout --detach b23ddbff12658185f0d506befec22a84f8b8c03b
          test "$(git rev-parse HEAD)" = "b23ddbff12658185f0d506befec22a84f8b8c03b"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/skia-sync-time.txt" \
            python3 tools/git-sync-deps 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/skia-sync.log"
          python3 bin/fetch-ninja
          clang++ --version | head -1
      - name: Build native Skia with its transitive GN dependencies and verify pixels
        shell: bash
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP/skia"
          # Place an ephemeral executable in Skia's OWN GN graph, so
          # partition_alloc, codecs and the rest of its dependencies link.
          mkdir -p pfx_probe
          cp "$GITHUB_WORKSPACE/compatibility/probes/skia-cpu.cpp" pfx_probe/pfx_compat.cpp
          cat > pfx_probe/BUILD.gn <<'GN'
          executable("pfx_cpu") {
            sources = [ "pfx_compat.cpp" ]
            include_dirs = [ "//" ]
            deps = [ "//:skia" ]
          }
          GN
          cat >> BUILD.gn <<'GN'
          group("pfx_compat") {
            deps = [ "//pfx_probe:pfx_cpu" ]
          }
          GN
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/skia-configure-time.txt" \
            bin/gn gen out/pfx --args='is_debug=false is_official_build=true skia_enable_gpu=false skia_use_harfbuzz=false skia_use_icu=false skia_use_libpng=false skia_use_libjpeg_turbo=false skia_use_libwebp=false cc="clang" cxx="clang++"' \
              2>&1 | tee "$GITHUB_WORKSPACE/artifacts/skia-configure.log"
          /usr/bin/time -v -o "$GITHUB_WORKSPACE/artifacts/skia-build-time.txt" \
            ninja -C out/pfx pfx_compat -j 2 \
              2>&1 | tee "$GITHUB_WORKSPACE/artifacts/skia-build.log"
          test -s out/pfx/libskia.a
          test -x out/pfx/pfx_cpu
          PFX_OUTPUT="$GITHUB_WORKSPACE/artifacts/skia-cpu.ppm" \
            out/pfx/pfx_cpu 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/skia-native.log"
          test -s "$GITHUB_WORKSPACE/artifacts/skia-cpu.ppm"
      - name: Retain Skia evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-compat-skia-native
          path: artifacts/
          if-no-files-found: ignore
