name: Vello CPU layered opacity blend and sequential dirty repaint proof
on:
  push:
    branches:
      - experiment/browser-aa-layered-repaint
    paths:
      - '.github/workflows/browser-aa-layered-repaint.yml'
      - 'compatibility/browser/aa-coverage-internals/**'
      - 'compatibility/browser/vello-complex/**'
      - 'compatibility/browser/web/aa-precision.html'
      - 'compatibility/browser/test-aa-layered-repaint.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# Browser-only assertion correction. WASM built from pinned source in
# run 38264169743 is reused only with explicit source-hash guards.
jobs:
  browser-layered-repaint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-vello-layer-wasm-build
          run-id: 38264169743
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Verify exact upstream-patched WASM source blobs
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object compatibility/browser/vello-complex/src/lib.rs)" = 94ee75205f98e88a61dd42345f971fe25e8643ba
          test "$(git hash-object compatibility/browser/vello-complex/Cargo.toml)" = 5c219a8bbcfcb8b129c24cbdcb6b7eb48f25315e
          test "$(git hash-object compatibility/browser/aa-coverage-internals/pfx_trace.rs)" = 6242e86868b211b68fb5b3712fc6bdc4973eee0c
          test "$(git hash-object compatibility/browser/aa-coverage-internals/patch-upstream.cjs)" = 399cfad80c72f1c945df8e9c8472a0d350c89818
          test "$(git hash-object compatibility/browser/web/aa-precision.html)" = e3ad4c398035e6442e6624e502a073299d6cb786
      - name: Assemble fully local source-built browser harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-layered-repaint.cjs
      - name: Verify layered CPU blend, full-vs-tile pixel parity and sequential repaint
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
          node compatibility/browser/test-aa-layered-repaint.cjs
          test -s artifacts/browser/proof/layered-repaint-summary.json
      - name: Keep complete positive or negative browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-vello-layer-repaint-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
