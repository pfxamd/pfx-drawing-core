name: Browser antialiasing precision, transformed dirty regions
on:
  push:
    branches:
      - experiment/browser-aa-precision
  workflow_dispatch:

permissions:
  contents: read

# The instrumented Vello WASM was source-built successfully by run 38244834052
# from the same Rust source (at commit bb3f2d5c). Reuse that exact artifact for
# JS-only test revisions; change this strategy if Rust sources are modified.
jobs:
  precision-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-aa-vello-build
          run-id: 38244834052
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Prepare isolated local Vello test
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-precision.cjs
      - name: Compare raw/straight RGBA, clip padding and transforms
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
            node compatibility/browser/test-aa-precision.cjs
          test -s artifacts/browser/proof/aa-precision-summary.json
      - name: Retain per-case evidence, screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-aa-precision-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
