name: Vello CPU operation-derived damage and sequential scene lifecycle proof
on:
  push:
    branches:
      - experiment/browser-aa-operation-damage
    paths:
      - '.github/workflows/browser-aa-operation-damage.yml'
      - 'compatibility/browser/aa-coverage-internals/**'
      - 'compatibility/browser/vello-complex/**'
      - 'compatibility/browser/web/aa-precision.html'
      - 'compatibility/browser/test-aa-operation-damage.cjs'
      - 'compatibility/browser/operation-damage.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# Browser-only semantic test change; pinned-source WASM is reused only
# with exact Rust, Cargo, upstream patch, trace and HTML blob guards.
jobs:
  browser-operation-damage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-vello-operation-wasm-built
          run-id: 38266908819
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Reject stale WASM after source or upstream patch changes
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object compatibility/browser/vello-complex/src/lib.rs)" = f12c5945cc99ae9163bf538d80e4ae38cf0fb297
          test "$(git hash-object compatibility/browser/vello-complex/Cargo.toml)" = 5c219a8bbcfcb8b129c24cbdcb6b7eb48f25315e
          test "$(git hash-object compatibility/browser/aa-coverage-internals/pfx_trace.rs)" = 6242e86868b211b68fb5b3712fc6bdc4973eee0c
          test "$(git hash-object compatibility/browser/aa-coverage-internals/patch-upstream.cjs)" = 399cfad80c72f1c945df8e9c8472a0d350c89818
          test "$(git hash-object compatibility/browser/web/aa-precision.html)" = dfb0b944189e7e0f593485d221727e0069100719
      - name: Assemble fully local source-built browser harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-operation-damage.cjs
          node --check compatibility/browser/operation-damage.cjs
      - name: Validate command-derived damage and cumulative dirty repaint across layer lifecycle
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
          node compatibility/browser/test-aa-operation-damage.cjs
          test -s artifacts/browser/proof/operation-damage-summary.json
      - name: Keep complete positive or negative browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-vello-operation-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
