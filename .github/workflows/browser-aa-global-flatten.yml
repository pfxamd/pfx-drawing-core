name: Vello CPU canonical global flattening, precision and cost
on:
  push:
    branches:
      - experiment/browser-aa-global-flatten
    paths:
      - '.github/workflows/browser-aa-global-flatten.yml'
      - 'compatibility/browser/aa-coverage-internals/**'
      - 'compatibility/browser/vello-complex/**'
      - 'compatibility/browser/web/aa-precision.html'
      - 'compatibility/browser/test-aa-global-flatten.cjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

# Replay the proven pinned-source WASM only for changed browser-side diagnostics.
# Any Rust, Cargo or upstream patch change must use a separate source rebuild.
jobs:
  browser-global-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-vello-global-flatten-source-built
          run-id: 38252020655
          github-token: ${{ github.token }}
          path: artifacts/vello
      - name: Ensure replay source matches the original Vello build
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git hash-object compatibility/browser/vello-complex/src/lib.rs)" = 4eccbb5f2c636ad0cc7a7e2ed5570785e6fb0980
          test "$(git hash-object compatibility/browser/vello-complex/Cargo.toml)" = 5c219a8bbcfcb8b129c24cbdcb6b7eb48f25315e
          test "$(git hash-object compatibility/browser/aa-coverage-internals/pfx_trace.rs)" = 325bebfb45439b6c64cfb4843e91cdbf3209c4dc
          test "$(git hash-object compatibility/browser/aa-coverage-internals/patch-upstream.cjs)" = 6a7d8279b19dfa1bee0d29ef887558c54c5390c3
          test "$(git hash-object compatibility/browser/web/aa-precision.html)" = a797acf8a69f2a160c353b58c4307018c6454ef6
      - name: Assemble fully local source-built browser harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/aa-precision.html artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_complex_bg.wasm artifacts/browser/web/
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node --check compatibility/browser/test-aa-global-flatten.cjs
      - name: Compare absolute-space Bezier flattening against local raster origins
        shell: bash
        run: |
          set -euxo pipefail
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
          node compatibility/browser/test-aa-global-flatten.cjs
          test -s artifacts/browser/proof/aa-global-flatten-summary.json
      - name: Keep complete positive or negative browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-vello-global-flatten-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
