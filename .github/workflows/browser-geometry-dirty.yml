name: Browser changing Vello geometry full canvas vs dirty tile
on:
  push:
    branches:
      - experiment/browser-geometry-dirty-region
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rebuild-vello-geometry-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check out exact pinned Vello CPU source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/linebender/vello.git "$RUNNER_TEMP/vello"
          git -C "$RUNNER_TEMP/vello" fetch --depth=1 origin 235739c4f08eb48d900e1512459d453a9ab77f96
          git -C "$RUNNER_TEMP/vello" checkout --detach 235739c4f08eb48d900e1512459d453a9ab77f96
          test "$(git -C "$RUNNER_TEMP/vello" rev-parse HEAD)" = "235739c4f08eb48d900e1512459d453a9ab77f96"
          cp -a compatibility/browser/vello-geometry "$RUNNER_TEMP/geometry"
          rustup target add wasm32-unknown-unknown
          mkdir -p artifacts/web
      - name: Compile updated actual Vello moving vector geometry source to WASM
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v -o artifacts/vello-geometry-build-time.txt \
            cargo build --manifest-path "$RUNNER_TEMP/geometry/Cargo.toml" \
              --release --target wasm32-unknown-unknown \
              2>&1 | tee artifacts/vello-geometry-build.log
          test -s "$RUNNER_TEMP/geometry/target/wasm32-unknown-unknown/release/pfx_vello_overlay.wasm"
      - name: Produce wasm-bindgen browser module
        shell: bash
        run: |
          set -euxo pipefail
          cargo install wasm-bindgen-cli --version 0.2.115 --locked --root "$RUNNER_TEMP/bindgen"
          "$RUNNER_TEMP/bindgen/bin/wasm-bindgen" \
            "$RUNNER_TEMP/geometry/target/wasm32-unknown-unknown/release/pfx_vello_overlay.wasm" \
            --target web --out-dir artifacts/web --out-name pfx_vello_overlay
          test -s artifacts/web/pfx_vello_overlay.js
          test -s artifacts/web/pfx_vello_overlay_bg.wasm
          grep -q 'render_dynamic_full' artifacts/web/pfx_vello_overlay.js
          grep -q 'render_dynamic_tile' artifacts/web/pfx_vello_overlay.js
      - name: Retain reproducible source-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-geometry-vello-wasm
          path: artifacts
          if-no-files-found: ignore

  geometry-dirty-browser:
    needs: rebuild-vello-geometry-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-geometry-vello-wasm
          path: artifacts/vello
      - uses: actions/download-artifact@v4
        with:
          name: pfx-source-browser-filament
          run-id: 38183319164
          github-token: ${{ github.token }}
          path: artifacts/filament
      - name: Assemble local source-built engine browser runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/* artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_overlay.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_overlay_bg.wasm artifacts/browser/web/
          cp artifacts/filament/web/filament.js artifacts/browser/web/
          cp artifacts/filament/web/filament.wasm artifacts/browser/web/
          cp artifacts/filament/web/triangle.filamat artifacts/browser/web/
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify actual per-frame Vello shapes pixel-identical full and dirty updates
        shell: bash
        run: |
          set -euxo pipefail
          node --check compatibility/browser/test-geometry-dirty.cjs
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
            node compatibility/browser/test-geometry-dirty.cjs
          test -s artifacts/browser/proof/geometry-dirty-summary.json
      - name: Preserve all screenshots and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-geometry-dirty-browser-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
