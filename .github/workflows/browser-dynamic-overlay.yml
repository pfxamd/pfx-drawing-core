name: Browser dynamic Vello 2D plus animated Filament 3D
on:
  push:
    branches:
      - experiment/browser-dynamic-overlay
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Reuses pinned source-built engine binaries for an isolated browser DATA-PATH probe.
# No engine selection, context sharing or production deployment.
jobs:
  dynamic-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pfx-source-browser-vello
          run-id: 38183319164
          github-token: ${{ github.token }}
          path: artifacts/vello
      - uses: actions/download-artifact@v4
        with:
          name: pfx-source-browser-filament
          run-id: 38183319164
          github-token: ${{ github.token }}
          path: artifacts/filament
      - name: Assemble wholly local browser runtime from proven source-build artifacts
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/browser/web artifacts/browser/proof
          cp compatibility/browser/web/* artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_overlay.js artifacts/browser/web/
          cp artifacts/vello/web/pfx_vello_overlay_bg.wasm artifacts/browser/web/
          cp artifacts/filament/web/filament.js artifacts/browser/web/
          cp artifacts/filament/web/filament.wasm artifacts/browser/web/
          cp artifacts/filament/web/triangle.filamat artifacts/browser/web/
          npm install --no-save playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Run repeated independent 2D and 3D cases with per-frame Vello upload
        shell: bash
        run: |
          set -euxo pipefail
          node --check compatibility/browser/test-dynamic.cjs
          PFX_WEBROOT="$GITHUB_WORKSPACE/artifacts/browser/web" \
          PFX_PROOF_DIR="$GITHUB_WORKSPACE/artifacts/browser/proof" \
            node compatibility/browser/test-dynamic.cjs
          test -s artifacts/browser/proof/dynamic-overlay-summary.json
      - name: Preserve per-case screenshots timing and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-dynamic-overlay-proof
          path: artifacts/browser/proof
          if-no-files-found: ignore
